<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CI/CD Practical Webpage</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 8px;

        }
        h1 { color: #0076ff; }
        .status-badge {
            background-color: #28a745;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            display: inline-block;
            margin-top: 10px;
        }
    </style>

<body>

    <div class="container">
        <h1 id="main-title">CI/CD Pipeline Pipeline Demo</h1>
        <p>If you are seeing this page, the automated deployment was successful!</p>
        <span class="status-badge">Status: Live & Automated</span>
    </div>

    <script>
        // Simple script that a CI test runner can check
        console.log("Webpage loaded successfully.");
    </script>

</html>
